# Hand-authored enrichments applied on top of the generated plugins.yml.
# This file is the source of truth for metadata that the plugin probe cannot discover:
# - hints and notes that require reading source code or live testing
# - allowed values for dynamic-values selects
# - format documentation for complex Hash/text attributes
#
# Structure: same as plugins.yml.  Only the keys present here are merged;
# everything else is left as generated.  Lists under "notes" are APPENDED
# (not replaced); all other values replace the generated value.
#
# Rule: never edit docs/plugins.yml directly — add the data here instead.
# Regenerate with: VERSION=<x> rake doc:plugin_specs

# ── A2: MergePoint ───────────────────────────────────────────────────────────
MergePoint:
  attributes:
    merged_inputs:
      hint: "Hash: {'name' => ['primary_expr', 'alternate_expr', 'type',\
        \ 'required|optional']}. Primary and alternate are placeholders or\
        \ fixed values; blank means use the input named <name> or\
        \ <name>_alternate respectively."
    multi_inputs:
      hint: "Hash: {'name' => ['type', count, 'required|optional']}. Generates\
        \ inputs <name>_1 … <name>_N and outputs <name> with the first\
        \ non-nil value."
    mandatory_inputs:
      hint: "Hash: {'name' => 'type'}. Shorthand for a merged_inputs entry\
        \ ['', '<%= name %>', 'type', 'required']: one input <name>, one output\
        \ <name>."
    optional_inputs:
      hint: "Hash: {'name' => 'type'}. Same as mandatory_inputs but marked\
        \ optional."
  inputs:
    "<merged_inputs>":
      type: string
      required: false
      note: "For each name declared in merged_inputs: input <name> if the\
        \ primary expression is blank (else the variables of its placeholders),\
        \ and input <name>_alternate if the alternate expression is blank (else\
        \ the variables of its placeholders). Type comes from\
        \ merged_inputs[name][2]."
    "<multi_inputs>":
      type: string
      required: false
      note: "One input per slot: <name>_1 … <name>_N. Type comes from\
        \ multi_inputs[name][0]."
  outputs:
    "<merged_inputs>":
      type: string
      note: "One output per name declared in merged_inputs. Type comes from\
        \ merged_inputs[name][2]."
    "<multi_inputs>":
      type: string
      note: "One output per name declared in multi_inputs. Type comes from\
        \ multi_inputs[name][0]."
  notes:
    - "merged_inputs format: {'name' => ['primary_expression',\
      \ 'alternate_expression', 'type', 'required|optional']}. The primary\
      \ expression is evaluated first; if the result is nil (or blank when\
      \ consider_blank_nil is true), the alternate is evaluated. A blank\
      \ expression means \"take the runtime input named <name>\" (primary)\
      \ or \"<name>_alternate\" (alternate)."
    - "multi_inputs format: {'name' => ['type', count, 'required|optional']}.\
      \ Generates optional inputs <name>_1 … <name>_N; the output <name>\
      \ receives the first non-nil value found in order."
    - "mandatory_inputs and optional_inputs are shorthands: each entry adds\
      \ a merged_inputs entry with blank primary, \"<%= name %>\" as\
      \ alternate, and the given type."
    - "When consider_blank_nil is true (default), empty strings and empty\
      \ arrays are treated as nil, so the alternate expression is tried."
    - "All inputs of the step are optional. 'required' (merged_inputs[name][3],\
      \ multi_inputs[name][2], mandatory_inputs) acts at execution: when no\
      \ value is found, the step ends with status Failed (\"A valid value was\
      \ not found for <names>\")."

# ── A4: SubWorkflow ───────────────────────────────────────────────────────────
SubWorkflow:
  attributes:
    workflow_outputs:
      hint: "Hash mapping output names in the parent to sub-workflow variable\
        \ paths. Format: {'parent_output_name' => 'StepName:output_name'}.\
        \ Use 'Parameter:ParameterName' to read a runtime parameter of the\
        \ sub-workflow. Example: {'result' => 'my_step:Result'}."
    workflow_inputs:
      hint: "Hash renaming step inputs to sub-workflow parameter names.\
        \ Format: {'step_input_name' => 'target_parameter_name'}. When blank,\
        \ input names must match the sub-workflow parameter names exactly."
  inputs:
    "<workflow runtime parameters>":
      type: varies
      required: varies
      note: "When workflow_id is set, one input per runtime parameter of the\
        \ target workflow is generated (required or optional matching the\
        \ parameter definition). Names come from workflow_inputs renaming, or\
        \ the parameter name directly."
  outputs:
    "<workflow_outputs>":
      type: varies
      note: "When workflow_id is set and workflow_outputs is configured, one\
        \ output per entry. Type comes from the Context variable of the\
        \ sub-workflow."
  notes:
    - "When workflow_id is set, inputs are the runtime parameters of the\
      \ target workflow (one per parameter, required/optional matching the\
      \ parameter). workflow_inputs renames them: key = step input name,\
      \ value = sub-workflow parameter name."
    - "workflow_outputs maps parent output names to sub-workflow variable\
      \ paths: {'parent_output' => 'StepName:output_name'}. Use\
      \ 'Parameter:name' to read a runtime parameter. When workflow_id is\
      \ blank, all sub-workflow variables are returned in\
      \ Sub-Workflow_Outputs."
    - "The sub-workflow runs asynchronously in a branched work order. The\
      \ parent step polls until the sub-workflow completes."

# ── A4: WorkflowLauncher ──────────────────────────────────────────────────────
WorkflowLauncher:
  attributes:
    workflow_inputs:
      hint: "Hash renaming step inputs to target workflow parameter names.\
        \ Format: {'step_input_name' => 'target_parameter_name'}. When blank,\
        \ input names must match parameter names."
    saved_inputs:
      hint: "Hash of parameter default values applied before runtime inputs:\
        \ {'param_name' => 'value'}. A saved_input makes the corresponding\
        \ runtime input optional."
  notes:
    - "When workflow_id is set, inputs are the runtime parameters of the\
      \ target workflow. workflow_inputs renames them: key = local step input\
      \ name, value = target parameter name. saved_inputs provides default\
      \ values; a saved_input makes the corresponding runtime input optional."
    - "WorkflowLauncher (fire-and-forget by default): the step completes as\
      \ soon as the work order is launched. Set wait_for_completion to true\
      \ to wait for the launched workflow to finish."
    - "When wait_for_completion is false and the launched workflow later\
      \ fails, the launcher step is already Complete: fail_if_failure has no\
      \ effect in that case."

# ── A7: EmailNotification ─────────────────────────────────────────────────────
EmailNotification:
  attributes:
    mailer_name:
      hint: "Name of the Mailer Configuration to use. When blank, the first\
        \ active mailer (lowest id) is used."
    destinations:
      hint: "One entry per recipient, separated by \" ..- \" (space-dot-dot-\
        hyphen-space). Format: \"<address> <type>\" where type is To, Cc or\
        \ Bcc. Example: \"alice@example.com To ..- bob@example.com Cc ..-\".\
        \ Legacy separator \"_-\" is also accepted."
  notes:
    - "destinations format: one entry per recipient separated by \" ..- \"\
      \ (space · dot · dot · hyphen · space). Each entry is \"<address>\
      \ <type>\" where type is To, Cc or Bcc. Example: \"alice@example.com\
      \ To ..- bob@example.com Cc ..-\". The legacy separator \" _- \" is\
      \ also accepted (To only)."
    - "When mailer_name is blank, Orchestrator uses MailServer.identify(nil),\
      \ which selects the first active Mailer Configuration (lowest id). If\
      \ no active mailer exists, the step returns Error."

# ── A8: FileJournalLogEntry ───────────────────────────────────────────────────
FileJournalLogEntry:
  attributes:
    processing_status:
      values: [Complete, Error, Failed, "In Progress"]
    journal_book:
      hint: "Name of an existing journal book, or \"--Runtime--\" to require\
        \ the book name at runtime via the \"Journal Book\" input. When blank,\
        \ the entry is logged without a book."
  notes:
    - "Allowed values for processing_status (and the File_processing_status\
      \ input): Complete, Error, Failed, In Progress. These map to the\
      \ standard Journal statuses defined in Journal::PREDEFINED_STATUS."
    - "Journal books must exist before the step runs. A missing book is NOT\
      \ created at execution time (unlike a workflow import, which creates\
      \ the book automatically). Create the book in Engine > Journaling\
      \ before deploying the workflow."
    - "When journal_book is set to \"--Runtime--\", the \"Journal Book\"\
      \ input becomes required."

# ── A6: UserInput ─────────────────────────────────────────────────────────────
UserInput:
  attributes:
    view_template:
      hint: "File name of a form view on the server, in folder\
        \ <config_dir>/actions_config/user_inputs/ (default:\
        \ /opt/aspera/orchestrator/config/orchestrator/actions_config/user_inputs/),\
        \ starting with _ and ending with .html.erb (example: _review.html.erb).\
        \ No API lists these files: ask the administrator. Blank: the default\
        \ form (received parameters, one field per requested data)."
    assigned_user_logins:
      hint: "Logins of the users the task is assigned to, separated by commas\
        \ (alice, bob) or as an array (['alice','bob']). Written by the template\
        \ editor."
    assigned_roles_logins:
      hint: "Names of the groups the task is assigned to, separated by commas\
        \ (Operators, Admin) or as an array. Written by the template editor."
    assigned_users:
      hint: "Before version 0.6.0: user ids separated by commas. Used only when\
        \ assigned_user_logins is null."
    assigned_roles:
      hint: "Before version 0.6.0: group ids separated by commas. Used only when\
        \ assigned_roles_logins is null."
    required_requested_data:
      hint: "{'name'=>'type'}: data the user must give in the form. Each name is\
        \ an output of the step."
    user_outputs:
      hint: "{'name'=>'type'}: data the user may give in the form. Each name is\
        \ an output of the step."
  outputs:
    "<required_requested_data>":
      type: varies
      note: "One output per name of required_requested_data, of the type given\
        \ in the value."
    "<user_outputs>":
      type: varies
      note: "One output per name of user_outputs, of the type given in the\
        \ value."
    InputProvider:
      note: "Id of the user who completed the task (a number). Set\
        \ expose_user_information to also get the login, name and email\
        \ address."
  notes:
    - "Assignment: the task goes to the users of assigned_user_logins and to\
      \ the groups of assigned_roles_logins. The inputs SingleUserAssignment (or\
      \ else UserAssignmentsArray) and SingleRoleAssignment (or else\
      \ RoleAssignmentsArray) replace them when set. assigned_users and\
      \ assigned_roles (ids) are read only when assigned_user_logins or\
      \ assigned_roles_logins is null: an empty string there means nobody. The first user to\
      \ complete the task completes the step; the other assignments are\
      \ preempted. A canceled task ends the step with status Failed."
    - "View template: an ERB view rendered inside the task form, which already\
      \ has the buttons Cancel and Complete Task. Locals: received_parameters\
      \ ({'<input name>'=>value}: the inputs of the step),\
      \ requested_user_inputs ({'<name>'=>'<type>'}: the requested data), and\
      \ active_assignment. Each requested data must be a form field named\
      \ outputs[<name>]: helper draw_input('outputs', name, type) draws a field\
      \ for the type."
    - "No view is installed with Orchestrator. Examples are in the plugin\
      \ folder, /opt/aspera/orchestrator/actions/user_inputs/sample_templates/:\
      \ _movie_qc, _review_movie_ui, _select_asset, _select_client follow the\
      \ interface above; _test_template_ui uses an older one (fails in 4.1.6)."
