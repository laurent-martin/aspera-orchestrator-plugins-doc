    client_key_passphrase:
      type: text
    shared_inbox_name: {type: string, hint: Enter shared inbox name, placeholders: true}
    private_key: {type: text, label: Ssh private key, widget: multiline_text, hint: Paste SSH Private key in PEM format}
    filters: {type: text, label: Filter conditions, widget: multiline_text, hint: 'e.g., (package.title == ''title_match_value'') and (package.status == ''completed'')', placeholders: true}
