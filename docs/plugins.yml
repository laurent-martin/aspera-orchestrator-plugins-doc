  version: 0.7.4
  min_orchestrator: 4.1.6
  description: This action plugin provides the ability to send email as part of the execution of a workflow. It can be configured with recipients, subject, message body, and optional sender details to enable workflow-driven email notifications.
  attributes:
    template: {type: text, label: Html message template, widget: multiline_text, format: html, code_default: <font color="gray">eMail generated by Aspera Orchestrator</font>, placeholders: true}
    payload: {type: text, label: Message Core Parameters (XML payload), widget: multiline_text, code_default: "<MessageDefinition><Destinations><To><%= To %></To></Destinations><Subject><%= Subject %></Subject></MessageDefinition>"}
    mailer_name: {type: string, hint: 'Name of the Mailer Configuration to use. When blank, the first active mailer (lowest id) is used.'}
    attachment_list: {type: text, placeholders: true}
    subject_line: {type: text, label: Subject, hint: Enter email subject, placeholders: true}
    destinations: {type: text, placeholders: true, hint: 'One entry per recipient, separated by " ..- " (space-dot-dot-hyphen-space). Format: "<address> <type>" where type is To, Cc or Bcc. Example: "alice@example.com To ..- bob@example.com Cc ..-". Legacy separator "_-" is also accepted.'}
    reply_to: {type: string, hint: optional - Use mailer specified one by default, placeholders: true}
    from_name: {type: string, label: Sender name, hint: optional - Use mailer specified one by default, placeholders: true}
    from_address: {type: string, label: Sender address, hint: optional - Use mailer specified one by default, placeholders: true}
    use_payload: {type: boolean, label: 'Legacy mode (xml header payload)?'}
    only_accept_full_email_address: {type: boolean, label: Ignore not fully qualified email address, code_default: false}
    force_base64: {type: boolean, label: Force attachments encoding in base64}
  inputs:
    To: {type: string, required: true, if_blank: destinations}
    Subject: {type: string, required: true, if_blank: subject_line}
    MessageDefinition_Override: {type: string, required: false}
    Template: {type: string, required: false, if_blank: template}
    Only_accept_full_email_address: {type: flag, required: false, if_blank: only_accept_full_email_address}
    attachment_list: {type: array, required: false, if_blank: attachment_list}
    Reply_to: {type: string, required: false, if_blank: reply_to}
    From_name: {type: string, required: false, if_blank: from_name}
    From_address: {type: string, required: false, if_blank: from_address}
  outputs:
    FullMessage: {type: string}
    Step_information: {type: hash}
  notes:
  - 'destinations format: one entry per recipient separated by " ..- " (space · dot · dot · hyphen · space). Each entry is "<address> <type>" where type is To, Cc or Bcc. Example: "alice@example.com To ..- bob@example.com Cc ..-". The legacy separator " _- " is also accepted (To only).'
  - When mailer_name is blank, Orchestrator uses MailServer.identify(nil), which selects the first active Mailer Configuration (lowest id). If no active mailer exists, the step returns Error.
