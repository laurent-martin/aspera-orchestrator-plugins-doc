WorkflowLauncher:
  display_name: Workflow launcher
  category: System
  version: 1.6.1
  min_orchestrator: 4.1.6
  description: This action plug-in is used to launch one workflow from within another. It is similar to, but not the same as, the SubWorkflow plug-in. The main difference is that WorkflowLauncher launches another workflow and then immediately allows the current workflow to proceed. This behavior is asynchronous, whereas in SubWorkflow, the current workflow waits for the launched workflow to complete before continuing. A WorkflowLauncher step is considered Complete once it has successfully launched the configured workflow, while a SubWorkflow step is considered Complete only after the sub-workflow it launched has finished execution.
  attributes:
    workflow_id: {type: integer}
    priority: {type: integer, label: Execution priority, code_default: 'WorkOrder::DEFAULT_PRIORITY rescue 2'}
    saved_inputs: {type: text, widget: hash, hint: 'Hash of parameter default values applied before runtime inputs: {''param_name'' => ''value''}. A saved_input makes the corresponding runtime input optional.'}
    work_order_name: {type: string, label: Work order description, hint: Optional description for the launched work order, placeholders: true}
    use_true_name: {type: boolean}
    running_as_user: {type: string, placeholders: true}
    tags: {type: text, hint: 'e.g., urgent, batch-2025 (comma-separated)', placeholders: true}
    launched_comments: {type: text, label: Work order comments, hint: Optional comments attached to the launched work order, placeholders: true}
    wait_for_completion: {type: boolean, code_default: false}
    polling_frequency: {type: integer, label: Polling frequency (seconds), code_default: 1}
    master_id: {type: text, hint: Optional}
    fail_if_failure: {type: boolean, label: Fail if launched work order fails, code_default: false}
    use_portable_id: {type: boolean, label: Use portable ID (if run-time workflow selection), default: false}
    portable_id: {type: string, placeholders: true}
    workflow_inputs: {type: text, hint: 'Hash renaming step inputs to target workflow parameter names. Format: {''step_input_name'' => ''target_parameter_name''}. When blank, input names must match parameter names.'}
    dedicated_worker: {type: boolean}
  inputs:
    Workflow_ID: {type: int, required: true, if_blank: workflow_id, when: {use_portable_id: {in: [false]}}}
    Tags: {type: array, required: false, if_blank: tags}
    Master_id: {type: int, required: false, if_blank: master_id}
    Workflow_Parameters: {type: hash, required: false, if_blank: workflow_id}
    WorkOrder_Description: {type: string, required: false, if_blank: work_order_name}
    Running_as_user: {type: string, required: false, if_blank: running_as_user}
    Execution_priority: {type: int, required: false, if_blank: priority}
    Launched_comments: {type: string, required: false, if_blank: launched_comments, if_set: workflow_id}
    Workflow_Portable_Id: {type: string, required: true, if_blank: [portable_id, workflow_id], when: {use_portable_id: {in: [true]}}}
  outputs:
    WorkOrder_ID: {type: int}
    WorkOrder_Status: {type: string}
    Step_information: {type: hash}
  notes:
  - 'Inputs are partly defined by template fields (for example a list of inputs, or <%= variable %> placeholders): see the template attributes.'
  - 'Outputs are partly defined by template fields: see the template attributes.'
  - 'When workflow_id is set, inputs are the runtime parameters of the target workflow. workflow_inputs renames them: key = local step input name, value = target parameter name. saved_inputs provides default values; a saved_input makes the corresponding runtime input optional.'
  - 'WorkflowLauncher (fire-and-forget by default): the step completes as soon as the work order is launched. Set wait_for_completion to true to wait for the launched workflow to finish.'
  - 'When wait_for_completion is false and the launched workflow later fails, the launcher step is already Complete: fail_if_failure has no effect in that case.'
