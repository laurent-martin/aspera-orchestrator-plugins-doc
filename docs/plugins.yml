    Weight: {type: [int, array], required: false, if_blank: weight, when: {operation: {in: [Add, Add_multiple]}}}
    Priority: {type: [int, array], required: false, if_blank: priority, when: {operation: {in: [Add, Add_multiple, List_all]}}}
