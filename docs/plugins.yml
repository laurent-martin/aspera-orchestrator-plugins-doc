    faspex_node: {type: string, widget: remote_node}
    notified_on_upload: {type: string, hint: 'Email addresses, comma separated', placeholders: true}
    notified_on_download: {type: string, hint: 'Email addresses, comma separated', placeholders: true}
    notified_on_receipt: {type: string, hint: 'Email addresses, comma separated', placeholders: true}
    expiration_policy: {type: string, widget: select, values: [none, delete_after_any_download, delete_after_all_download], code_default: none}
    release_policy: {type: string, widget: select, values: [now, on_date, later], code_default: now}
    release_at: {type: string, label: Release date, widget: date}
    content_protection_passphrase:
      type: string
      hint: Enter content protection passphrase
      placeholders: true
    payload: {type: text}
    note: {type: text, widget: multiline_text, hint: Enter package note, placeholders: true}
    metadata: {type: text, label: Package metadata, widget: multiline_text, hint: '"Field1":"Value1","Field2":"Value2"...'}
    recipients: {type: text, placeholders: true}
    private_recipients: {type: text, placeholders: true}
    paths: {type: text, label: File paths, hint: List of file and directory paths to transfer, placeholders: true}
    private_key: {type: text, label: Ssh private key, widget: multiline_text, hint: SSH Private key in PEM format or path to the PEM file}
    client_id: {type: text, label: Faspex api client id, hint: Enter Faspex API client ID, placeholders: true}
    download_limit: {type: integer, hint: Leave blank for no limit}
    remote_source_id: {type: integer, label: Shared folder id, hint: Enter shared folder ID}
    use_remote_source: {type: boolean, default: false}
    ear_enabled: {type: boolean, default: false}
    notify_on_upload: {type: boolean, default: false}
    notify_on_download: {type: boolean, default: false}
    notify_on_receipt: {type: boolean, default: false}
    obfuscation_enabled: {type: boolean, default: false}
    prevent_http_download: {type: boolean, default: false}
    skip_metadata_validation: {type: boolean, default: false}
    get_package_status_link: {type: boolean, default: false}
    public_download: {type: string, widget: boolean, code_default: false}
  inputs:
    Title: {type: string, required: true, if_blank: title}
    Faspex_server_address: {type: string, required: true, if_blank: [faspex_hostname, faspex_node]}
    Recipients: {type: string, required: true, if_blank: recipients}
    Faspex_sender_user: {type: string, required: true, if_blank: faspex_sender_user}
    Faspex_api_client_id: {type: string, required: true, if_blank: client_id}
    Ssh_private_key: {type: string, required: true, if_blank: private_key}
    File_paths: {type: string, required: true, if_blank: paths}
    Note: {type: string, required: false, if_blank: note}
    Notified_on_upload: {type: string, required: false, if_blank: notified_on_upload}
    Notified_on_download: {type: string, required: false, if_blank: notified_on_download}
    Notified_on_receipt: {type: string, required: false, if_blank: notified_on_receipt}
    Content_protection_passphrase:
      type: string
      required: false
      if_blank: content_protection_passphrase
    Private_recipients: {type: string, required: false, if_blank: private_recipients}
    Shared_folder_id: {type: [string, int], required: false, if_blank: remote_source_id}
    Release_date: {type: date, required: true, when: {release_policy: {in: [on_date]}}}
  outputs:
    Id: {type: string}
    Transfer_spec: {type: string}
    Step_information: {type: hash}
    Status_link: {type: string, when: {get_package_status_link: {in: [true]}}}
Faspex5FileProcessing:
  display_name: Faspex5 file processing
  category: File Transfer
