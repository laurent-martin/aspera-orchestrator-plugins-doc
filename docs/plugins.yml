    Faspex_user: {type: string, required: true, if_blank: faspex_user}
    Faspex_client_id: {type: string, required: true, if_blank: faspex_api_client_id}
    Ssh_private_key: {type: string, required: true, if_blank: ssh_private_key}
    File_id: {type: string, required: true, if_blank: file_id, when: {operation: {in: [Update file status]}}}
    Error_message: {type: string, required: false, if_blank: error_message, when: {operation: {in: [Update file status]}, file_status: {in: [null, "--runtime--", Processing failed]}}}
    File_status: {type: string, required: true, when: {operation: {in: [Update file status]}, file_status: {in: ["--runtime--"]}}}
  outputs:
    Step_information: {type: hash}
