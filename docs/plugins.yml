  description: This plugin can be used to reconcile inputs coming from different branches of logical statements. It provides the ability to define pairs of inputs that get merged. Such steps can be used without inputs to clarify branching in complex workflows.
  attributes:
    merged_inputs: {type: text, hint: 'Hash: {''name'' => [''primary_expr'', ''alternate_expr'', ''type'', ''required|optional'']}. Primary and alternate are placeholders or fixed values; blank means use the input named <name> or <name>_alternate respectively.'}
    multi_inputs: {type: text, hint: 'Hash: {''name'' => [''type'', count, ''required|optional'']}. Generates inputs <name>_1 … <name>_N and outputs <name> with the first non-nil value.'}
    consider_blank_nil: {type: boolean, label: Consider empty objects as null, default: true}
    mandatory_inputs: {type: text, hint: 'Hash: {''name'' => ''type''}. Shorthand for a merged_inputs entry ['''', ''<%= name %>'', ''type'', ''required'']: one input <name>, one output <name>.'}
    optional_inputs: {type: text, hint: 'Hash: {''name'' => ''type''}. Same as mandatory_inputs but marked optional.'}
  inputs:
    "<merged_inputs>": {type: string, required: false, note: 'For each name declared in merged_inputs: input <name> if the primary expression is blank (else the variables of its placeholders), and input <name>_alternate if the alternate expression is blank (else the variables of its placeholders). Type comes from merged_inputs[name][2].'}
    "<multi_inputs>": {type: string, required: false, note: 'One input per slot: <name>_1 … <name>_N. Type comes from multi_inputs[name][0].'}
  outputs:
    Step_information: {type: hash}
    "<merged_inputs>": {type: string, note: 'One output per name declared in merged_inputs. Type comes from merged_inputs[name][2].'}
    "<multi_inputs>": {type: string, note: 'One output per name declared in multi_inputs. Type comes from multi_inputs[name][0].'}
  notes:
  - 'Inputs are partly defined by template fields (for example a list of inputs, or <%= variable %> placeholders): see the template attributes.'
  - 'merged_inputs format: {''name'' => [''primary_expression'', ''alternate_expression'', ''type'', ''required|optional'']}. The primary expression is evaluated first; if the result is nil (or blank when consider_blank_nil is true), the alternate is evaluated. A blank expression means "take the runtime input named <name>" (primary) or "<name>_alternate" (alternate).'
  - 'multi_inputs format: {''name'' => [''type'', count, ''required|optional'']}. Generates optional inputs <name>_1 … <name>_N; the output <name> receives the first non-nil value found in order.'
  - 'mandatory_inputs and optional_inputs are shorthands: each entry adds a merged_inputs entry with blank primary, "<%= name %>" as alternate, and the given type.'
  - When consider_blank_nil is true (default), empty strings and empty arrays are treated as nil, so the alternate expression is tried.
  - 'All inputs of the step are optional. ''required'' (merged_inputs[name][3], multi_inputs[name][2], mandatory_inputs) acts at execution: when no value is found, the step ends with status Failed ("A valid value was not found for <names>").'
