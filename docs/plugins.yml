  description: This action plugin enables interaction with MongoDB databases, supporting document operations (insert, find, update, remove), advanced queries, aggregation pipelines, map-reduce processing, and database administration commands for comprehensive data management and analysis.
  attributes:
    additional_arguments: {type: text}
    additional_options: {type: text}
    allow_all_to_be_removed: {type: boolean, label: 'Allow Empty Selector? (An empty selector deletes all records)', code_default: false}
    client_options: {type: text, code_default: "{}", placeholders: true}
    collection_name: {type: string, hint: Enter collection name, placeholders: true}
    collection_options: {type: text, widget: multiline_text, hint: "{ }", code_default: "{}"}
    condition: {type: text}
    connection_uri: {type: text, code_default: 'mongodb://localhost:27017', placeholders: true}
    database_name: {type: string, hint: 'e.g., my_database', code_default: test, placeholders: true}
    database_options: {type: text, hint: "{ }", code_default: "{}", placeholders: true}
    document: {type: text, widget: multiline_text, hint: "{ }", placeholders: true}
    finalize_function: {type: text}
    initial: {type: text}
    key: {type: text, placeholders: true}
    map_function: {type: text, placeholders: true}
    operation: {type: string, widget: select, values: [Database_command, Document_aggregate, Document_count, Document_distinct, Document_find, Document_find_and_modify, Document_find_one, Document_group, Document_insert, Document_map_reduce, Document_remove, Document_save, Document_update], placeholders: true}
    options: {type: text, widget: multiline_text, hint: "{ }", code_default: "{}", placeholders: true}
    pipeline: {type: text, placeholders: true}
    reduce_function: {type: text, placeholders: true}
    selector: {type: text, widget: multiline_text, hint: "{ }", code_default: "{}", placeholders: true}
    specification: {type: text}
    logging_enabled: {type: boolean}
  inputs:
    Operation: {type: string, required: {if_blank: operation}}
    Collection_name: {type: string, required: true, if_blank: collection_name, when: {operation: {in: [null, Document_aggregate, Document_count, Document_distinct, Document_find, Document_find_and_modify, Document_find_one, Document_group, Document_insert, Document_map_reduce, Document_remove, Document_save, Document_update]}}}
    Connection_uri: {type: string, required: false, if_blank: connection_uri}
    Database_name: {type: string, required: false, if_blank: database_name}
    Client_options: {type: hash, required: false, if_blank: client_options}
    Database_options: {type: hash, required: false, if_blank: database_options}
    Logging_enabled: {type: flag, required: false}
    Collection_options: {type: hash, required: false, when: {operation: {in: [null, Document_aggregate, Document_count, Document_distinct, Document_find, Document_find_and_modify, Document_find_one, Document_group, Document_insert, Document_map_reduce, Document_remove, Document_save, Document_update]}}}
    Selector: {type: hash, required: false, if_blank: selector, when: {operation: {in: [Database_command, Document_distinct, Document_find, Document_find_one, Document_remove, Document_update]}}}
    Options: {type: hash, required: false, if_blank: options, when: {operation: {not_in: [Document_aggregate, Document_count, Document_group, Document_insert, Document_map_reduce, Document_save]}}}
    Pipeline: {type: array, required: false, if_blank: pipeline, when: {operation: {in: [Document_aggregate]}}}
    Key: {type: string, required: true, if_blank: key, when: {operation: {in: [Document_distinct]}}}
    Document: {type: hash, required: false, if_blank: document, when: {operation: {in: [Document_insert, Document_save, Document_update]}}}
    Map_function: {type: string, required: true, if_blank: map_function, when: {operation: {in: [Document_map_reduce]}}}
    Reduce_function: {type: string, required: true, if_blank: reduce_function, when: {operation: {in: [Document_map_reduce]}}}
    Allow_all_to_be_removed: {type: flag, required: false, when: {operation: {in: [Document_remove]}}}
  outputs:
    Step_information: {type: hash}
    Response: {type: hash, when: {operation: {in: [Database_command, Document_map_reduce, Document_remove, Document_update]}}}
    Results: {type: array, when: {operation: {in: [Document_aggregate, Document_distinct, Document_find, Document_group]}}}
    Count: {type: int, when: {operation: {in: [Document_count]}}}
    Document: {type: hash, if_blank: document, when: {operation: {in: [Document_find_and_modify, Document_find_one]}}}
    Document_id: {type: string, when: {operation: {in: [Document_insert, Document_save]}}}
