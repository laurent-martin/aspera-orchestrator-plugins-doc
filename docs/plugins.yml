SubWorkflow:
  display_name: Sub-workflow
  category: System
  version: 1.5.3
  min_orchestrator: 4.1.6
  description: This action plug-in allows you to embed an entire, separately defined workflow as a single step within another workflow. This enables you to break down complex processes into manageable sub-workflows, making them easier to build, maintain, and reuse.
  attributes:
    workflow_id: {type: integer}
    exit_status_for_errors: {type: string, label: Map Error state to, widget: select, values: [Failed, Error], code_default: Failed}
    use_true_name: {type: boolean}
    use_workorder_status: {type: boolean, label: End with Work Order status}
    workflow_portable_id: {type: string}
    execution_priority: {type: integer, hint: Optional — defaults to calling work order priority}
    workflow_outputs: {type: text, hint: 'Hash mapping output names in the parent to sub-workflow variable paths. Format: {''parent_output_name'' => ''StepName:output_name''}. Use ''Parameter:ParameterName'' to read a runtime parameter of the sub-workflow. Example: {''result'' => ''my_step:Result''}.'}
    workflow_inputs: {type: text, hint: 'Hash renaming step inputs to sub-workflow parameter names. Format: {''step_input_name'' => ''target_parameter_name''}. When blank, input names must match the sub-workflow parameter names exactly.'}
  inputs:
    Workflow_ID: {type: int, required: true, if_blank: workflow_id}
    Sub-Workflow_Input_Parameters: {type: hash, required: false, if_blank: workflow_id}
    Execution_priority: {type: int, required: false, if_blank: execution_priority}
    "<workflow runtime parameters>": {type: varies, required: varies, note: 'When workflow_id is set, one input per runtime parameter of the target workflow is generated (required or optional matching the parameter definition). Names come from workflow_inputs renaming, or the parameter name directly.'}
  outputs:
    Sub-Workflow_workorder_ID: {type: int}
    Sub-Workflow_Outputs: {type: hash, if_blank: workflow_id}
    Step_information: {type: hash}
    "<workflow_outputs>": {type: varies, note: 'When workflow_id is set and workflow_outputs is configured, one output per entry. Type comes from the Context variable of the sub-workflow.'}
  notes:
  - 'Inputs are partly defined by template fields (for example a list of inputs, or <%= variable %> placeholders): see the template attributes.'
  - 'Outputs are partly defined by template fields: see the template attributes.'
  - 'When workflow_id is set, inputs are the runtime parameters of the target workflow (one per parameter, required/optional matching the parameter). workflow_inputs renames them: key = step input name, value = sub-workflow parameter name.'
  - 'workflow_outputs maps parent output names to sub-workflow variable paths: {''parent_output'' => ''StepName:output_name''}. Use ''Parameter:name'' to read a runtime parameter. When workflow_id is blank, all sub-workflow variables are returned in Sub-Workflow_Outputs.'
  - The sub-workflow runs asynchronously in a branched work order. The parent step polls until the sub-workflow completes.
