FileJournalLogEntry:
  display_name: File journal log entry
  category: Other Utilities
  version: 0.4.2
  min_orchestrator: 4.1.6
  description: This plugin provides the ability to log file states in the Orchestrator file journal.
  attributes:
    file: {type: string, label: File (optional), placeholders: true}
    file_path: {type: string, label: File path (optional), placeholders: true}
    package: {type: string, label: Package (optional), placeholders: true}
    step_name: {type: string, label: Step name (optional)}
    processing_status: {type: string, label: Journal status, widget: select, dynamic_values: true, values: [Complete, Error, Failed, In Progress]}
    event: {type: string, label: Event (optional), placeholders: true}
    processing_timeout: {type: integer, label: Processing timeout for file (optional)}
    journal_book: {type: string, widget: select, dynamic_values: true, hint: 'Name of an existing journal book, or "--Runtime--" to require the book name at runtime via the "Journal Book" input. When blank, the entry is logged without a book.'}
    new_file: {type: boolean, label: 'New File?', code_default: false}
    new_package: {type: boolean, label: 'New Package?', code_default: false}
    milestone: {type: integer, label: Journal milestone, code_default: 0}
    journal_to_file: {type: boolean, label: 'Log to External File?', code_default: false}
    journal_file_path: {type: string, label: Journaling file path, code_default: "/tmp/log/journal.log"}
    file_entry_format: {type: string, label: Journal entry format, code_default: 'event[time],event[package],event[file],event[status],event[event]'}
    max_file_count: {type: integer, label: Number of files to keep, code_default: 5}
    max_file_size_in_mb: {type: integer, label: Maximum file size (mb), code_default: 5}
    write_to_journal: {type: boolean, label: 'Also Log to DB Journal?', default: true}
  inputs:
    File_path: {type: string, required: false}
    package: {type: string, required: false}
    package_ID: {type: string, required: false}
    file: {type: string, required: false, if_blank: file}
    File_processing_status: {type: string, required: false, if_blank: processing_status}
    file_ID: {type: int, required: false}
    New_file: {type: flag, required: false, if_blank: new_file}
    New_package: {type: flag, required: false, if_blank: new_package}
    Milestone: {type: int, required: false, if_blank: milestone}
    Journal Book: {type: string, required: false}
  outputs:
    actual_package_ID: {type: string}
    actual_file: {type: string}
    actual_path: {type: string}
    journal_file_ID: {type: int}
    Step_information: {type: hash}
  notes:
  - 'Allowed values for processing_status (and the File_processing_status input): Complete, Error, Failed, In Progress. These map to the standard Journal statuses defined in Journal::PREDEFINED_STATUS.'
  - Journal books must exist before the step runs. A missing book is NOT created at execution time (unlike a workflow import, which creates the book automatically). Create the book in Engine > Journaling before deploying the workflow.
  - When journal_book is set to "--Runtime--", the "Journal Book" input becomes required.
