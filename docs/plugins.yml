    package_id: {type: text}
    get_transfer_spec: {type: boolean, default: true}
    transfer_type: {type: string, widget: select, values: [connect, transfer_client], default: connect}
  inputs:
    Faspex_user: {type: string, required: {if_blank: user}}
    Ssh_private_key: {type: string, required: true, if_blank: private_key}
    Faspex_client_id: {type: string, required: true, if_blank: client_id}
    Faspex_server_address: {type: string, required: true, if_blank: [server, faspex_node]}
    Polling_frequency: {type: int, required: false}
    Persistence_scope: {type: string, required: false, if_blank: trigger_type}
    Package Id: {type: string, required: false}
    Packages_root: {type: string, required: false, if_blank: packages_root}
    Filters_override: {type: string, required: false, if_blank: filters}
    Destination_root: {type: string, required: false, if_blank: destination_root}
    Shared_inbox_name: {type: string, required: true, if_blank: shared_inbox_name, when: {mailbox: {in: [shared_inbox]}}}
  outputs:
    Title: {type: string}
    Id: {type: string}
    Completed: {type: date}
    Released: {type: date}
    Updated: {type: date}
    Status: {type: string}
    State: {type: string}
    Author_name: {type: string}
    Author_email: {type: string}
    Recipient_name: {type: string}
    Recipient_email: {type: string}
    Meta_data: {type: hash}
    Recipient_list: {type: hash}
    File_list: {type: array}
    Transfer_spec: {type: string}
    Package_location: {type: string}
    Message: {type: string}
    EAR Enabled: {type: flag}
    Package UUID: {type: string}
    Completed download count: {type: int}
    Partial download count: {type: int}
    Active download count: {type: int}
    Expiration policy: {type: string}
    Package Download Link: {type: string}
    Step_information: {type: hash}
  notes:
  - 'Inputs are partly defined by template fields (for example a list of inputs, or <%= variable %> placeholders): see the template attributes.'
