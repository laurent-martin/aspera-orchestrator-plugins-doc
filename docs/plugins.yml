    reply_to: {type: string, label: Reply to Queue, hint: Enter reply-to queue name}
    content_type: {type: string, label: Content Type, hint: 'e.g., application/json'}
    content_encoding: {type: string, label: Content Encoding, hint: 'e.g., UTF-8'}
    correlation_id: {type: string, label: Correlation ID, hint: Enter correlation ID}
    priority: {type: integer, hint: Enter message priority}
    message_id: {type: string, label: Message ID, hint: Enter message ID}
    user_id: {type: string, label: User ID, hint: Enter user ID}
