    Message: {type: string, required: true, if_blank: message, when: {accept_multiple_messages: {in: [false]}}}
    Queue_user: {type: string, required: false, if_blank: queue_user}
    Queue_password:
      type: string
      required: false
      if_blank: queue_password
    Routing_key: {type: string, required: false, if_blank: routing_key}
    Exchange_name: {type: string, required: false, if_blank: exchange_name}
    Queue_port: {type: int, required: false, if_blank: queue_port}
    Queue_node: {type: string, required: false, if_blank: queue_node}
    Queue_host: {type: string, required: false, if_blank: queue_host}
    Queue_vhost: {type: string, required: false, if_blank: [queue_vhost, queue_host, queue_node]}
    additional_queue_message_parameters: {type: flag, required: false, when: {additional_queue_message_parameters: {in: [false]}}}
    auto_delete: {type: flag, required: false, when: {auto_delete: {in: [null, false]}}}
    exclusive: {type: flag, required: false, when: {exclusive: {in: [null, false]}}}
    x_max_priority: {type: int, required: false, if_blank: x_max_priority}
    x_message_ttl: {type: int, required: false, if_blank: x_message_ttl}
    x_expires: {type: int, required: false, if_blank: x_expires}
    mandatory: {type: flag, required: false, when: {mandatory: {in: [null, false]}}}
    timestamp: {type: date, required: false, if_blank: timestamp}
    expiration: {type: int, required: false, if_blank: expiration}
    type: {type: string, required: false, if_blank: type}
    reply_to: {type: string, required: false, if_blank: reply_to}
    content_type: {type: string, required: false, if_blank: content_type}
    content_encoding: {type: string, required: false, if_blank: content_encoding}
    correlation_id: {type: string, required: false, if_blank: correlation_id}
    priority: {type: int, required: false, if_blank: priority}
    message_id: {type: string, required: false, if_blank: message_id}
    user_id: {type: string, required: false, if_blank: user_id}
    app_id: {type: string, required: false, if_blank: app_id}
    headers: {type: hash, required: false, if_blank: header}
    durable: {type: flag, required: false, when: {durable: {in: [false]}}}
    persistent: {type: flag, required: false, when: {persistent: {in: [false]}}}
    Message_list: {type: array, required: {if_blank: message}, when: {accept_multiple_messages: {in: [true]}}}
  outputs:
    Inserted_message: {type: string, when: {hide_message: {in: [null, false]}, accept_multiple_messages: {in: [false]}}}
    Queue_name: {type: string}
    Step_information: {type: hash}
    Inserted_messages: {type: array, when: {hide_message: {in: [null, false]}, accept_multiple_messages: {in: [true]}}}
